name: Release

# Publie automatiquement une Release GitHub à chaque push/merge sur une
# branche de canal. Le numéro de base (X.Y.Z) reste bumpé à la main dans
# composer.json/CHANGELOG.md (voir docs/releasing.md) : ce workflow se
# contente d'ajouter/incrémenter le suffixe de canal (alpha/beta) ou de
# tagger tel quel pour une release stable (main).
#
# - alpha -> vX.Y.Z-alpha.N (prerelease)
# - beta  -> vX.Y.Z-beta.N  (prerelease)
# - main  -> vX.Y.Z         (release stable ; ignoré si le tag existe déjà,
#            c'est-à-dire si aucun bump de version n'a eu lieu depuis)

on:
  push:
    branches: [alpha, beta, main]

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Determine channel and next tag
        id: version
        run: |
          set -euo pipefail

          BASE_VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['version'];")
          BRANCH="${{ github.ref_name }}"

          case "$BRANCH" in
            alpha) CHANNEL=alpha; PRERELEASE=true ;;
            beta)  CHANNEL=beta;  PRERELEASE=true ;;
            main)  CHANNEL=release; PRERELEASE=false ;;
            *) echo "Branche non gérée : $BRANCH"; exit 1 ;;
          esac

          if [ "$CHANNEL" = "release" ]; then
            TAG="v${BASE_VERSION}"
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag $TAG déjà publié, rien à faire (pas de bump de version depuis)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            LAST=$(git tag -l "v${BASE_VERSION}-${CHANNEL}.*" | sed -E "s/.*\.([0-9]+)\$/\1/" | sort -n | tail -1)
            NEXT=$(( ${LAST:-0} + 1 ))
            TAG="v${BASE_VERSION}-${CHANNEL}.${NEXT}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail

          if [ "${{ steps.version.outputs.channel }}" = "release" ]; then
            HEADER="## [${{ steps.version.outputs.base_version }}]"
          else
            HEADER="## [Unreleased]"
          fi

          awk -v header="$HEADER" '
            index($0, header) == 1 && !found { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.txt

          if [ ! -s release-notes.txt ]; then
            echo "::error::Aucune entrée CHANGELOG.md trouvée pour '${HEADER}' — ajoutez les notes de version avant de publier une release sur ce canal."
            exit 1
          fi

      - name: Create tag and GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"

          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Kintai $TAG" \
            --notes-file release-notes.txt \
            --target "${{ github.ref_name }}" \
            $PRERELEASE_FLAG
