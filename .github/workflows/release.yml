name: Release

# Publie automatiquement une Release GitHub à chaque push/merge sur une
# branche de canal. Le numéro de base (X.Y.Z) reste bumpé à la main dans
# composer.json/CHANGELOG.md (voir docs/releasing.md) : ce workflow se
# contente d'ajouter le suffixe de canal (alpha/beta) ou de tagger tel quel
# pour une release stable (main).
#
# - alpha -> vX.Y.Z-alpha (prerelease, tag glissant : réécrit à chaque push
#            tant que X.Y.Z ne bouge pas, pas d'accumulation de .1/.2/.3...)
# - beta  -> vX.Y.Z-beta  (prerelease, même principe de tag glissant)
# - main  -> vX.Y.Z       (release stable ; ignoré si le tag existe déjà,
#            c'est-à-dire si aucun bump de version n'a eu lieu depuis)

on:
  push:
    branches: [alpha, beta, main]

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Determine channel and next tag
        id: version
        run: |
          set -euo pipefail

          BASE_VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['version'];")
          BRANCH="${{ github.ref_name }}"

          case "$BRANCH" in
            alpha) CHANNEL=alpha; PRERELEASE=true ;;
            beta)  CHANNEL=beta;  PRERELEASE=true ;;
            main)  CHANNEL=release; PRERELEASE=false ;;
            *) echo "Branche non gérée : $BRANCH"; exit 1 ;;
          esac

          ROLLING=false
          if [ "$CHANNEL" = "release" ]; then
            TAG="v${BASE_VERSION}"
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag $TAG déjà publié, rien à faire (pas de bump de version depuis)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # Tag glissant : un seul vX.Y.Z-{channel} par version en cours,
            # réécrit à chaque push tant que la version de base ne change pas
            # (voir l'étape suivante, qui le force-update s'il existe déjà).
            TAG="v${BASE_VERSION}-${CHANNEL}"
            ROLLING=true
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "rolling=$ROLLING" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail

          extract_section() {
            awk -v header="$1" '
              index($0, header) == 1 && !found { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          }

          # Vide au sens strict = aucun caractère non-blanc (un awk qui ne
          # trouve que la ligne blanche séparant deux "## [" produit 1 octet
          # de saut de ligne, que `[ -s ]` considère à tort comme non-vide).
          is_blank() {
            ! grep -q '[^[:space:]]' "$1"
          }

          BASE_VERSION="${{ steps.version.outputs.base_version }}"

          if [ "${{ steps.version.outputs.channel }}" = "release" ]; then
            extract_section "## [${BASE_VERSION}]" > release-notes.txt
          else
            # Sur alpha/beta, la plupart des push accumulent leurs notes sous
            # [Unreleased] — sauf le commit de release lui-même, qui renomme
            # [Unreleased] en "## [X.Y.Z]" dans le même commit (voir
            # docs/releasing.md) et laisse donc [Unreleased] vide : dans ce
            # cas précis, les notes réelles vivent déjà sous la section
            # versionnée qui vient d'être créée.
            extract_section "## [Unreleased]" > release-notes.txt
            if is_blank release-notes.txt; then
              extract_section "## [${BASE_VERSION}]" > release-notes.txt
            fi
          fi

          if is_blank release-notes.txt; then
            echo "::error::Aucune entrée CHANGELOG.md trouvée pour '[Unreleased]' ou '[${BASE_VERSION}]' — ajoutez les notes de version avant de publier une release sur ce canal."
            exit 1
          fi

      - name: Create tag and GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          if [ "${{ steps.version.outputs.rolling }}" = "true" ]; then
            # Supprime l'ancienne release + tag du canal (s'ils existent) avant
            # de republier au commit courant, pour que vX.Y.Z-{channel} reste
            # unique au lieu de s'accumuler en .1/.2/.3...
            gh release delete "$TAG" --yes --cleanup-tag || true
            git tag -d "$TAG" 2>/dev/null || true
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi

          git tag "$TAG"
          git push origin "$TAG"

          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Kintai $TAG" \
            --notes-file release-notes.txt \
            --target "${{ github.ref_name }}" \
            $PRERELEASE_FLAG
