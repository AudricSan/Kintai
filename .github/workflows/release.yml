name: Release

# Publie automatiquement une Release GitHub à chaque push/merge sur une
# branche de canal. Aucun numéro n'est saisi à la main : le tag suivant se
# déduit du plus haut tag vX.Y.Z existant et du canal qui publie (voir
# docs/releasing.md).
#
# Schéma de version X.Y.Z — chaque canal fixe un chiffre, et un seul :
# - alpha -> incrémente Z            (X.Y.Z -> X.Y.Z+1)
# - beta  -> incrémente Y, Z = 0     (X.Y.Z -> X.Y+1.0)
# - main  -> incrémente X, Y = Z = 0 (X.Y.Z -> X+1.0.0)
# Seul main peut donc changer le premier chiffre, seul beta le deuxième,
# seul alpha le troisième. Le plus haut tag existant sert de référence,
# quel que soit le canal qui l'a publié.
#
# Le canal (alpha/beta/release) n'est pas déterminé en inspectant le tag
# mais via le target_commitish de la Release GitHub — voir
# GithubUpdateService::selectReleaseForChannel().

on:
  push:
    branches: [alpha, beta, main]

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Determine channel and next tag
        id: version
        run: |
          set -euo pipefail

          BRANCH="${{ github.ref_name }}"

          case "$BRANCH" in
            alpha) CHANNEL=alpha; PRERELEASE=true ;;
            beta)  CHANNEL=beta;  PRERELEASE=true ;;
            main)  CHANNEL=release; PRERELEASE=false ;;
            *) echo "Branche non gérée : $BRANCH"; exit 1 ;;
          esac

          # Plus haut tag vX.Y.Z existant (tri de version, tous canaux
          # confondus). Aucun tag -> on part de 0.0.0.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          LATEST=${LATEST:-0.0.0}
          IFS='.' read -r X Y Z <<< "$LATEST"

          # Chaque canal fixe un seul chiffre et remet à zéro ceux de droite.
          case "$CHANNEL" in
            alpha)   Z=$((Z + 1)) ;;
            beta)    Y=$((Y + 1)); Z=0 ;;
            release) X=$((X + 1)); Y=0; Z=0 ;;
          esac

          VERSION="${X}.${Y}.${Z}"
          TAG="v${VERSION}"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Le tag ${TAG} existe déjà (collision improbable, p.ex. deux publications concurrentes) — relancez le workflow."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail

          extract_section() {
            awk -v header="$1" '
              index($0, header) == 1 && !found { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          }

          # Vide au sens strict = aucun caractère non-blanc (un awk qui ne
          # trouve que la ligne blanche séparant deux "## [" produit 1 octet
          # de saut de ligne, que `[ -s ]` considère à tort comme non-vide).
          is_blank() {
            ! grep -q '[^[:space:]]' "$1"
          }

          VERSION="${{ steps.version.outputs.version }}"

          # La plupart des push accumulent leurs notes sous [Unreleased] —
          # sauf le commit de release lui-même, qui renomme [Unreleased] en
          # "## [X.Y.Z]" dans le même commit (voir docs/releasing.md) et
          # laisse donc [Unreleased] vide : dans ce cas précis, les notes
          # réelles vivent déjà sous la section versionnée.
          extract_section "## [Unreleased]" > release-notes.txt
          if is_blank release-notes.txt; then
            extract_section "## [${VERSION}]" > release-notes.txt
          fi

          if is_blank release-notes.txt; then
            echo "::error::Aucune entrée CHANGELOG.md trouvée pour '[Unreleased]' ou '[${VERSION}]' — ajoutez les notes de version avant de publier une release sur ce canal."
            exit 1
          fi

      - name: Create tag and GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.version.outputs.tag }}"

          git tag "$TAG"
          git push origin "$TAG"

          PRERELEASE_FLAG=""
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Kintai $TAG" \
            --notes-file release-notes.txt \
            --target "${{ github.ref_name }}" \
            $PRERELEASE_FLAG
